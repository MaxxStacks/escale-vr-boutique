name: Meyer API probe
on:
  push:
    branches: [meyer-sync]
    paths: ['integrations/meyer/probe.mjs', '.github/workflows/meyer-probe.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency: meyer-probe
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: meyer-sync }
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: node integrations/meyer/probe.mjs
        env:
          MEYER_API_KEY: ${{ secrets.MEYER_API_KEY }}
      - name: Commit report
        run: |
          git config user.name "meyer-probe[bot]"
          git config user.email "actions@users.noreply.github.com"
          git add integrations/meyer/probe-report.md
          git commit -m "Meyer probe report [skip ci]" || exit 0
          git push origin HEAD:meyer-sync
